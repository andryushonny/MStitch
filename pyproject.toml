[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mstitch"
version = "0.1.0"
description = "Fast and precise stitching of microscope tile scans from MControl (C++, CPU now, CUDA next)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "zstandard>=0.22"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["mstitch"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
