name: build
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -v .[test] nvidia-cuda-nvrtc-cu12
      - name: fake CUDA driver for the GPU-path tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build/mock -DMSTITCH_MOCK_CUDA=ON
          cmake --build build/mock --target mock_cuda -j 4
          echo "MSTITCH_MOCK_CUDA=$PWD/build/mock/libmock_cuda.so" >> $GITHUB_ENV
      - name: tests (from tests/, so the installed package is imported, not the source folder)
        working-directory: tests
        run: python -m pytest -q
      - name: wheel
        if: matrix.os == 'windows-latest'
        run: python -m pip wheel . -w dist --no-deps
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: wheel-windows
          path: dist/*.whl
