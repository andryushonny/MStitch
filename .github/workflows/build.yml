name: build
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -v .[test] nvidia-cuda-nvrtc-cu12
      - name: fake CUDA driver for the GPU-path tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build/mock -DMSTITCH_MOCK_CUDA=ON
          cmake --build build/mock --target mock_cuda -j 4
          echo "MSTITCH_MOCK_CUDA=$PWD/build/mock/libmock_cuda.so" >> $GITHUB_ENV
      - name: tests (from tests/, so the installed package is imported, not the source folder)
        working-directory: tests
        run: python -m pytest -q
      - name: wheel
        if: matrix.os == 'windows-latest'
        run: python -m pip wheel . -w dist --no-deps
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: wheel-windows
          path: dist/*.whl

  # Windows wheels for the Pythons in use, so nobody needs a compiler: MControl installs from here
  wheels:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . -w dist --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl

  # a new version in pyproject.toml on main: a release with the wheels (MControl takes the latest)
  release:
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          awk "/^## $v/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MStitch ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: dist/*.whl
